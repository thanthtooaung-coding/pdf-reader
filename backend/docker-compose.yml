services:
  redis:
    image: redis:7-alpine
    container_name: pdfreader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdfreader-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    volumes:
      - pdfreader_storage:/app/storage
    depends_on:
      - redis

volumes:
  pdfreader_storage:
